name: Compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install github/gh-aw

      - name: Validate workflow package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh aw validate --dir workflows --strict
